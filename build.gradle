plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version '8.10.4'
}

base {
	archivesName = project.name
}

repositories {
	mavenCentral()
	maven { url = "https://maven.wispforest.io/releases/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// owo jar-in-jars its own libs
	implementation("io.wispforest:owo-lib:${project.owo_version}") { transitive = false }

	// owo injects endec into mc classes, owo ships it in game
	compileOnly "io.wispforest:endec:0.1.12"
	testRuntimeOnly "io.wispforest:endec:0.1.12"

	// optional, api for ModMenuEntry only, never in the jar
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	from('LICENSE', 'COPYING', 'NOTICE.md')
}

// dev tool, in test so not in the jar
// ./gradlew replay --args="<recording> [--raw] [--cold] [--marks]", none = newest in ../Recordings
tasks.register('replay', JavaExec) {
	group = 'dev'
	description = 'Prints a recording as a timeline and checks it against what the game saw live'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.skysurveyor.tools.Replay'
	workingDir = projectDir
}

// screenshots: ./gradlew runClientGameTest, shots in build/run/clientGameTest/screenshots
// not in build/check, opens a game window
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "skysurveyor-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		// loom clears on every launch setup, ide sync too, wiped a run mid test
		clearRunDirectory = false
	}
}

def gameTestRun = layout.buildDirectory.dir('run/clientGameTest')
def gameTestData = gameTestRun.map { it.dir('skysurveyor') }
tasks.register('cleanGameTestRun', Delete) {
	delete gameTestRun.map { it.dir('screenshots') }, gameTestRun.map { it.dir('saves') }, gameTestData
}
// -Pfresh: no journal, shoots the guide like a new install
def freshShots = project.hasProperty('fresh')
// real journal + hud from old-saves, else empty screens
tasks.register('seedGameTestData', Copy) {
	if (!freshShots) {
		from('src/test/resources/old-saves/0.26.0-alpha.20') { exclude 'expected-*', 'hud.json' }
		from('src/test/resources/old-saves/0.26.0-alpha.25') { include 'hud.json' }
	}
	// nicks bazaar prices 11-24, gems + campfire only, for the guide tab
	from('src/gametest/resources/seed') { include 'prices.json' }
	into gameTestData
	dependsOn 'cleanGameTestRun'
}
tasks.named('runClientGameTest') {
	dependsOn 'seedGameTestData'
	if (freshShots) jvmArgs '-Dskysurveyor.fresh=true'
}

// build fails until spotlessApply
spotless {
	java {
		target 'src/*/java/**/*.java'
		removeUnusedImports()
		importOrder('java|javax', '', 'dev.skysurveyor', '\\#')
		trimTrailingWhitespace()
		endWithNewline()
		formatAnnotations()
	}
}
